global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  # Prometheus monitors itself
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # EC2 machine metrics from Node Exporter
  - job_name: ec2-node
    static_configs:
      - targets:
          - 18.61.25.99:9100

  # Application metrics from Kubernetes
  - job_name: vle7-application
    metrics_path: /metrics
    static_configs:
      - targets:
          - 18.61.25.99:30080

  # Kubernetes cluster metrics from kube-state-metrics
  - job_name: kubernetes-state
    metrics_path: /metrics
    static_configs:
      - targets:
          - 18.61.25.99:30081